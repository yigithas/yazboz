spring.application.name=yazboz

# Server Port
server.port=${PORT:8081}


spring.datasource.url=${YAZBOZ_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${YAZBOZ_USERNAME:postgres}
spring.datasource.password=${YAZBOZ_PASSWORD:1}

# JPA / Hibernate
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:fyeyklbw}
cloudinary.api-key=${CLOUDINARY_API_KEY:139257611698938}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}